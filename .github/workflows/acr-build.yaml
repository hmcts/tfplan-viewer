name: Build image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'acr-build/**'
      - '.github/workflows/acr-build.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'acr-build/**'
      - '.github/workflows/acr-build.yaml'

jobs:
  main:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    env:
      AZURE_CONTAINER_REGISTRY_URL: hmctspublic.azurecr.io
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Generate build ID
        id: prep
        run: |
          sha=${GITHUB_SHA::8}
          ts=$(date +%s)
          echo "BUILD_ID=${sha}-${ts}" >> $GITHUB_OUTPUT

      - name: 'Az CLI login'
        uses: azure/login@v2
        with:
          client-id: b354d443-d632-4d61-8ee8-2abc2c7baf23 # DTS Shared GitHub Actions ACR Publisher 1
          tenant-id: 531ff96d-0ae9-462a-8d2d-bec7c0b42082 # HMCTS.NET
          allow-no-subscriptions: true

      - name: 'ACR Login'
        run: |
          az acr login --name hmctsprod

      # HMCTSPROD ACR
      - name: 'Build and push PR image to HMCTSPROD'
        if: github.event_name == 'pull_request'
        run: |
          docker build . -t hmctsprod.azurecr.io/rpe/tfplan-viewer:pr-${{github.event.number}}-${{ steps.prep.outputs.BUILD_ID }}
          docker push hmctsprod.azurecr.io/rpe/tfplan-viewer:pr-${{github.event.number}}-${{ steps.prep.outputs.BUILD_ID }}

      - name: 'Build and push prod image to HMCTSPROD'
        if: github.ref == 'refs/heads/main'
        run: |
          docker build . -t hmctsprod.azurecr.io/rpe/tfplan-viewer:prod-${{ steps.prep.outputs.BUILD_ID }} -t hmctsprod.azurecr.io/rpe/tfplan-viewer:latest
          docker push hmctsprod.azurecr.io/rpe/tfplan-viewer:prod-${{ steps.prep.outputs.BUILD_ID }}
          docker push hmctsprod.azurecr.io/rpe/tfplan-viewer:latest

      # HMCTSPUBLIC ACR
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Login to Azure Container Repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_CONTAINER_REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and Push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.AZURE_CONTAINER_REGISTRY_URL }}/rpe/tfplan-viewer:pr-${{ steps.prep.outputs.BUILD_ID }}